# These are standalone PEP 723 scripts run with `uv run`, not a package, so the
# ruff config lives here rather than in a pyproject.toml.
#
# Lint:   uvx ruff@0.16.9 check .
# Format: uvx ruff@0.16.9 format .
#
# The version is pinned (also in ci.yml and README.md) so a new ruff release
# can't fail CI or a local run on its own. Bump all three together.

line-length = 100
# Matches the `requires-python` in each script's inline metadata block.
target-version = "py313"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[format]
quote-style = "double"
indent-style = "space"
