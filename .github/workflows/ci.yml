name: CI

# Pull requests as well as pushes, because a check that only runs after the
# push has already landed reports a problem that is already in main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint the Python demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # These are standalone PEP 723 scripts, not a package, so there is nothing
      # to install: `uvx` fetches ruff on its own and `ruff.toml` configures it.
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  tests:
    name: Test the dependency-free scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The floor every script's inline metadata declares. Testing the
          # oldest supported interpreter is the point; a newer one would hide a
          # syntax or stdlib feature the scripts are not allowed to use yet.
          python-version: "3.13"
      # Stdlib unittest, so there is nothing to install. It covers the two
      # scripts with `dependencies = []`: the genetic algorithm demo and the
      # process adventure. The numpy demos are the next job, so this one stays
      # dependency-free.
      - run: python -m unittest discover -s tests

  tests-numpy:
    name: Test the numpy demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # `uv run --with` resolves numpy the way `uv run` does for the scripts
      # themselves, so nothing is installed into a shared interpreter. The
      # version range copies the two scripts' own; keep it in step with them.
      # Because it is a fresh resolve each time, this job is also what notices
      # when a new numpy inside that range breaks a demo.
      - run: >-
          uv run --no-project --python 3.13 --with 'numpy>=2.0,<3'
          python -m unittest discover -s tests/numpy

  prolog:
    name: Test the Prolog game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y swi-prolog-nox
      # `-t halt` makes a failing test a failing exit status; without it the
      # run reports the failure and then exits 0.
      - run: swipl -g run_tests -t halt mansion_escape/tests.pl
